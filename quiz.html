<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Night &mdash; Game Night</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<div class="quiz-shimmer"></div>

<header class="topbar">
  <a href="index.html" class="back-link">&larr; Game Night</a>
  <span class="topbar-title">📺 QUIZ NIGHT</span>
</header>

<main class="wrap">

  <!-- SETUP -->
  <section id="screen-setup" class="screen active">
    <h1 class="screen-title">Build the Board</h1>
    <p class="screen-sub">Pick a theme and set up your teams to get started.</p>

    <div class="block block-wide">
      <h2 class="block-label">1. Choose a theme</h2>
      <div id="theme-grid" class="theme-grid"></div>
    </div>

    <div class="block">
      <h2 class="block-label">2. Add teams</h2>
      <div id="teams-setup" class="teams-setup"></div>
      <button type="button" id="btn-add-team" class="btn-add-team">+ Add Team</button>
    </div>

    <button type="button" id="btn-start" class="btn-primary" disabled>Start Quiz &rarr;</button>
  </section>

  <!-- BOARD -->
  <section id="screen-board" class="screen">
    <div class="scoreboard" id="scoreboard"></div>
    <p id="scroll-hint" class="scroll-hint hidden">Scroll sideways to see all categories &rarr;</p>
    <div class="board-scroll">
      <div id="board" class="board"></div>
    </div>
    <div class="board-actions">
      <button type="button" id="btn-reset" class="btn-secondary">Reset Game</button>
      <button type="button" id="btn-new-quiz" class="btn-secondary">New Quiz</button>
    </div>
  </section>

</main>

<!-- QUESTION OVERLAY -->
<div id="overlay" class="overlay">
  <div class="question-card">
    <span class="q-meta" id="q-meta">Category &middot; 100</span>
    <p class="q-text" id="q-text">Question text goes here?</p>
    <div id="answer-block" class="answer-block hidden">
      <span class="a-label">Answer</span>
      <p class="a-text" id="a-text">Answer text</p>
    </div>
    <button type="button" id="btn-show-answer" class="btn-primary">Show Answer</button>
    <div id="award-row" class="award-row hidden"></div>
    <button type="button" id="btn-back-board" class="btn-secondary hidden">Back to Board</button>
  </div>
</div>

<script src="js/data-quiz.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
